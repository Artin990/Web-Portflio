</tbody>

</table>

<section class="add-product">

<h2>

افزودن محصول جدید

</h2>

<form id="addProductForm">

<div class="admin-grid">

<div>

<label>نام محصول</label>

<input
type="text"
id="productName"
placeholder="نام محصول">

</div>

<div>

<label>برند</label>

<input
type="text"
id="productBrand"
placeholder="برند">

</div>

<div>

<label>قیمت</label>

<input
type="number"
id="productPrice"
placeholder="قیمت">

</div>

<div>

<label>موجودی</label>

<input
type="number"
id="productStock"
placeholder="موجودی">

</div>

<div>

<label>دسته بندی</label>

<select id="productCategory">

<option>آرایشی</option>

<option>عطر</option>

<option>مراقبت پوست</option>

<option>مراقبت مو</option>

</select>

</div>

<div>

<label>تصویر محصول</label>

<input
type="file"
id="productImage">

</div>

</div>

<label>

توضیحات

</label>

<textarea
id="productDescription">

</textarea>

<button type="submit">

افزودن محصول

</button>
