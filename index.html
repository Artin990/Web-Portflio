<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>نمای کارها ⁂ طراح و توسعه‌دهنده تعاملی وب</title>
  <meta name="description" content="نمایشگاه تعاملی نمونه‌کارهای طراحی رابط کاربری، فرانت‌اند و موشن وب">
  <link rel="stylesheet" crossorigin href="/assets/index-D5zpw1WX.css">
  <style>
    /* Live Preview Modal Styling (Hidden by default to prevent FOUC on refresh) */
    #live-preview-modal {
      display: none !important;
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 100000 !important;
      background: rgba(0, 0, 0, 0.78) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      align-items: center !important;
      justify-content: center !important;
      padding: 24px !important;
      box-sizing: border-box !important;
      opacity: 0;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #live-preview-modal.active {
      display: flex !important;
      opacity: 1 !important;
    }

    .modal-sheet-window {
      width: 88vw;
      max-width: 1200px;
      height: 85vh;
      background: #0f0f11;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.96) translateY(12px);
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #live-preview-modal.active .modal-sheet-window {
      transform: scale(1) translateY(0);
    }

    .modal-sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.04);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      direction: ltr;
      user-select: none;
      flex-shrink: 0;
    }

    .modal-sheet-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-sheet-dots i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
    }

    .modal-sheet-dots i:hover {
      transform: scale(1.18);
      filter: brightness(1.2);
    }

    .modal-sheet-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      color: #ffffff;
    }

    .modal-sheet-title .badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
    }

    .modal-sheet-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-sheet-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .modal-sheet-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .modal-sheet-body {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #000000;
      overflow: hidden;
    }

    .modal-sheet-iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div id="root" role="application" aria-label="Portfolio Application"></div>

  <!-- In-Page Live Modal (hidden until opened via openLiveModal) -->
  <div id="live-preview-modal" onclick="handleModalBackdropClick(event)">
    <div class="modal-sheet-window" id="modalWindow">
      <div class="modal-sheet-header">
        <div class="modal-sheet-dots">
          <i style="background:#ff5f56" onclick="closeLiveModal()" title="بستن (ESC)"></i>
          <i style="background:#ffbd2e" onclick="toggleModalFullscreen()" title="تغییر اندازه"></i>
          <i style="background:#27c93f" onclick="toggleModalFullscreen()" title="تمام‌صفحه"></i>
        </div>

        <div class="modal-sheet-title">
          <span id="modalProjectName">Live Preview</span>
          <span class="badge" id="modalProjectBadge">دموی تعاملی و زنده</span>
        </div>

        <div class="modal-sheet-actions">
          <button class="modal-sheet-btn" onclick="closeLiveModal()">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            <span>بستن (Esc)</span>
          </button>
          <a class="modal-sheet-btn" id="modalExternalLink" href="#" target="_blank" rel="noopener">
            <span>تب جدید</span>
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
      </div>
      <div class="modal-sheet-body">
        <iframe class="modal-sheet-iframe" id="liveIframe" src="about:blank"></iframe>
      </div>
    </div>
  </div>

  <script>
    function injectNoScrollbar(iframe) {
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        if (!doc) return;
        const style = doc.createElement('style');
        style.id = 'hide-scrollbars-injected';
        style.textContent = `
          html, body, * {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
          }
          *::-webkit-scrollbar {
            display: none !important;
            width: 0px !important;
            height: 0px !important;
            background: transparent !important;
          }
        `;
        (doc.head || doc.documentElement).appendChild(style);
      } catch(e) {}
    }

    window.openLiveModal = function(url, title) {
      const modal = document.getElementById('live-preview-modal');
      const iframe = document.getElementById('liveIframe');
      const titleEl = document.getElementById('modalProjectName');
      const extLink = document.getElementById('modalExternalLink');
      
      titleEl.textContent = title || 'Live Preview';
      extLink.href = url || '#';
      
      iframe.onload = function() {
        injectNoScrollbar(iframe);
        [100, 300, 600].forEach(delay => {
          setTimeout(() => {
            try {
              const win = iframe.contentWindow;
              if (win) {
                win.dispatchEvent(new Event('resize'));
                win.dispatchEvent(new Event('scroll'));
                if (win.ScrollTrigger) win.ScrollTrigger.refresh();
                if (win.gsap && win.gsap.globalTimeline) win.gsap.globalTimeline.play();
              }
            } catch(err) {}
          }, delay);
        });
      };
      
      iframe.src = url || 'about:blank';
      modal.classList.add('active');
    };

    window.closeLiveModal = function() {
      const modal = document.getElementById('live-preview-modal');
      modal.classList.remove('active');
      setTimeout(() => {
        if (!modal.classList.contains('active')) {
          document.getElementById('liveIframe').src = 'about:blank';
        }
      }, 400);
    };

    window.handleModalBackdropClick = function(e) {
      if (e.target.id === 'live-preview-modal') {
        closeLiveModal();
      }
    };

    window.toggleModalFullscreen = function() {
      const w = document.getElementById('modalWindow');
      if (w.style.maxWidth === '100vw') {
        w.style.maxWidth = '1100px';
        w.style.width = '86vw';
        w.style.height = '82vh';
        w.style.borderRadius = '18px';
      } else {
        w.style.maxWidth = '100vw';
        w.style.width = '100vw';
        w.style.height = '100vh';
        w.style.borderRadius = '0px';
      }
    };

    window.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeLiveModal();
      }
    });

    document.addEventListener('click', function(e) {
      const liveBtn = e.target.closest('a[href*="/sites/"]');
      if (liveBtn) {
        e.preventDefault();
        e.stopPropagation();
        const url = liveBtn.getAttribute('href');
        let title = 'Live Preview';
        if (url.includes('lumiera')) title = 'Lumiera';
        else if (url.includes('nudea')) title = 'Nudéa Beauty';
        else if (url.includes('gsap-demo')) title = 'Motion Lab';
        else if (url.includes('gsap-showcase') || url.includes('project-showcase')) title = 'Project Showcase';
        else if (url.includes('khordo')) title = 'Khordo';
        window.openLiveModal(url, title);
      }
    }, true);
  </script>
  <script type="module" crossorigin src="/assets/index-BZ_LNnp5.js"></script>
</body>
</html>
